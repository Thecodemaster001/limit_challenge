services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: submissions
      POSTGRES_USER: submissions
      POSTGRES_PASSWORD: submissions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U submissions -d submissions"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8001
    environment:
      DEBUG: "True"
      DATABASE_URL: postgres://submissions:submissions@db:5432/submissions
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CSRF_TRUSTED_ORIGINS: http://localhost:3001
      SEED_DATA: "true"
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    environment:
      API_INTERNAL_URL: http://api:8001
    ports:
      - "3001:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
